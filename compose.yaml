services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cours
      POSTGRES_PASSWORD: cours
      POSTGRES_DB: reservations
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cours", "-d", "reservations"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://cours:cours@db:5432/reservations
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |-
          fetch('http://127.0.0.1:3000/health')
            .then(response => { process.exitCode = response.ok ? 0 : 1 })
            .catch(() => { process.exitCode = 1 })
      interval: 3s
      timeout: 3s
      retries: 15
  db-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: cours
      POSTGRES_PASSWORD: cours
      POSTGRES_DB: reservations_test
    ports:
      - "127.0.0.1:5433:5432"
volumes:
  data:
