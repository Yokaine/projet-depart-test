services:
  - type: web
    name: reservations-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reservations-db
          property: connectionString

databases:
  - name: reservations-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
